<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>კონტაქტი - ALL IN ONE</title>
    <link rel="stylesheet" href="styleS.css"> 
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">ALL IN ONE.</div>

            <div class="nav-links">
                <a href="index.html">მთავარი</a>
                <a href="about.html">ჩვენს შესახებ</a>
                <a href="services.html">სერვისები</a>
                <a href="gallery.html">გალერეა</a>
                <a href="contact.html">კონტაქტი</a>
            </div>

            <div class="search-box">
                <input type="text" placeholder="ძებნა...">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>

            <a href="registration.html" class="register-button">რეგისტრაცია</a> 
        </nav>
    </header>
    <main>
        <section class="contact">
            <h1>დაგვიკავშირდით</h1>
            <div class="contactdetails">
                <p id="contaqtsid">შეავსე ფორმა და ჩვენი გუნდი მალე დაგიკავშირდებათ.</p>

                <label for="name">სახელი :</label>
                <input type="text" placeholder="შეავსეთ სახელი" required>
               
                
                <label for="email">ელ. ფოსტა:</label>
                <input type="email" placeholder="შეავსეთ ელ ფოსტა" required>
                
                
                <label for="message">საკონტაქტო ნომერი:</label>
                <input type="number" placeholder="შეავსეთ საკონტაქტო ნომერი" required>
               
                
                <label for="message">კომენტარი</label>
                <input id="coment"  type="text" placeholder="დატოვეთ თქვენი კომენტარი" required>

                <button class="button"   type="submit">გაგზავნა</button>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <p>2024 Adventure Platform - ყველა უფლება დაცულია.</p>
            <div class="footer-links">
                <a href="about.html">ჩვენს შესახებ</a>
                <a href="privacy.html">კონფიდენციალურობა</a>
                <a href="terms.html">წესები და პირობები</a>
            </div>
        </div>
    </footer>
</body>
</html>
