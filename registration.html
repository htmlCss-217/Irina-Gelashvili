<body>
  <div class="registration">   
    <div class="container"> 
      <div class="reg_title">რეგისტრაცია</div>
      <div class="content"> 
        <form action="#">
          <div class="user-details"> 
            <div class="input-box">
              <span class="details">სახელი</span>
              <input type="text" placeholder="შეავსეთ სახელი" required>
            </div> 
            <div class="input-box">
              <span class="details">გვარი</span>
              <input type="text" placeholder="შეავსეთ გვარი" required>
            </div> 
            <div class="input-box">
              <span class="details">მეილი</span>
              <input type="text" placeholder="შეავსეთელ. მეილი" required>
            </div> 
            <div class="input-box">
              <span class="details">ტელეფონის ნომერი</span>
              <input type="text" placeholder="შეავსეთ ტელეფონის ნომერი" required>
            </div> 
            <div class="input-box">
              <span class="details">პაროლი</span>
              <input type="text" placeholder="შეავსეთ პაროლი" required>
            </div> 
            <div class="input-box">
              <span class="details">გაიმეორე პაროლი</span>
              <input type="text" placeholder="შეიყვანე პაროლი განმეორებით" required>
            </div>
          </div>
